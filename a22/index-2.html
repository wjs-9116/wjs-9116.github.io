<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>镜花水月 · 飘花</title>
    <script src="js/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: '楷体', 'KaiTi', serif;
            padding: 0;
        }

        .container {
            width: 1024px;
            max-width: 100%;
            padding: 0;
            text-align: center;
            background-color: #000000;
            margin: 0 auto;
        }

        .title {
            font-family: '楷体', 'KaiTi', serif;
            color: #ffffff;
            font-size: 50px;
            line-height: 60px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0 10px 0;
            letter-spacing: 2px;
        }

        .carousel-wrapper {
            position: relative;
            display: inline-block;
            border: 5px dashed #ffffff;
            border-radius: 30px;
            overflow: hidden;
            background-color: #000000;
            line-height: 0;
            max-width: 100%;
        }

        .carousel-inner {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            background-color: #000000;
        }

        .carousel-slides {
            position: relative;
            width: 100%;
            height: auto;
            border-radius: 25px;
            overflow: hidden;
        }

        .carousel-slides .placeholder {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            visibility: hidden;
            pointer-events: none;
        }

        .carousel-slides .placeholder img {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            visibility: hidden;
            border-radius: 25px;
        }

        .carousel-slides img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: block;
            border-radius: 25px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            will-change: opacity;
            z-index: 1;
        }

        .carousel-slides img.active {
            opacity: 1;
            z-index: 10;
        }

        .flower-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
            border-radius: 25px;
            background-color: transparent;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 40px;
                line-height: 50px;
            }
            .carousel-wrapper {
                border-radius: 20px;
                border-width: 4px;
            }
            .carousel-inner,
            .carousel-slides,
            .carousel-slides img,
            .flower-overlay {
                border-radius: 16px;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 30px;
                line-height: 40px;
            }
            .carousel-wrapper {
                border-radius: 15px;
                border-width: 3px;
            }
            .carousel-inner,
            .carousel-slides,
            .carousel-slides img,
            .flower-overlay {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">镜花水月</div>

        <div class="carousel-wrapper" id="carouselWrapper">
            <div class="carousel-inner">
                <div class="carousel-slides" id="carouselSlides">
                    <div class="placeholder">
                        <img src="images/海棠1.jpg" alt="placeholder">
                    </div>
                    <img src="images/海棠1.jpg" alt="海棠1" class="active" data-index="0">
                    <img src="images/海棠2.jpg" alt="海棠2" data-index="1">
                    <img src="images/海棠3.jpg" alt="海棠3" data-index="2">
                    <img src="images/海棠4.jpg" alt="海棠4" data-index="3">
                </div>
                <div class="flower-overlay" id="flowerOverlay"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var slideImages = document.querySelectorAll('#carouselSlides img:not(.placeholder img)');
            if (!slideImages.length) return;

            var currentIndex = 0,
                timer = null,
                INTERVAL = 10000,
                wrapper = document.getElementById('carouselWrapper'),
                isPaused = false;

            function goToIndex(index) {
                index = (index + slideImages.length) % slideImages.length;
                slideImages.forEach(function(img) { img.classList.remove('active'); });
                slideImages[index].classList.add('active');
                currentIndex = index;
            }

            function nextSlide() { goToIndex(currentIndex + 1); }

            function startCarousel() {
                stopCarousel();
                if (!isPaused) timer = setInterval(nextSlide, INTERVAL);
            }

            function stopCarousel() {
                if (timer) { clearInterval(timer);
                    timer = null; }
            }

            wrapper.addEventListener('mouseenter', function() { isPaused = true;
                stopCarousel(); });
            wrapper.addEventListener('mouseleave', function() { isPaused = false;
                startCarousel(); });
            wrapper.addEventListener('click', function() {
                nextSlide();
                stopCarousel();
                if (!isPaused) startCarousel();
            });

            goToIndex(0);
            startCarousel();

            var RENDERER = {
                INIT_CHERRY_BLOSSOM_COUNT: 40,
                MAX_ADDING_INTERVAL: 50,

                init: function(container) {
                    this.$container = $(container);
                    this.setParameters();
                    this.createCherries();
                    this.render();
                },

                setParameters: function() {
                    this.width = this.$container.width();
                    this.height = this.$container.height();
                    this.context = $('<canvas />')
                        .attr({ width: this.width, height: this.height })
                        .appendTo(this.$container)
                        .get(0)
                        .getContext('2d');
                    this.cherries = [];
                    this.maxAddingInterval = Math.round(this.MAX_ADDING_INTERVAL * 1000 / this.width);
                    this.addingInterval = this.maxAddingInterval;
                    this.render = this.render.bind(this);
                },

                createCherries: function() {
                    var totalCount = Math.round(this.INIT_CHERRY_BLOSSOM_COUNT * this.width / 1000);
                    var halfCount = Math.floor(totalCount / 2);
                    
                    for (var i = 0; i < totalCount; i++) {
                        var isRandom = (i < halfCount);
                        this.cherries.push(new CHERRY_BLOSSOM(this, isRandom));
                    }
                },

                render: function() {
                    requestAnimationFrame(this.render);
                    this.context.clearRect(0, 0, this.width, this.height);

                    this.cherries.sort(function(a, b) { return a.z - b.z; });
                    for (var i = this.cherries.length - 1; i >= 0; i--) {
                        if (!this.cherries[i].render(this.context)) {
                            this.cherries.splice(i, 1);
                        }
                    }
                    if (--this.addingInterval === 0) {
                        this.addingInterval = this.maxAddingInterval;
                        this.cherries.push(new CHERRY_BLOSSOM(this, false));
                    }
                }
            };

            var CHERRY_BLOSSOM = function(renderer, isRandom) {
                this.renderer = renderer;
                this.init(isRandom);
            };

            CHERRY_BLOSSOM.prototype = {
                FOCUS_POSITION: 300,
                FAR_LIMIT: 600,
                MAX_RIPPLE_COUNT: 100,
                RIPPLE_RADIUS: 100,
                SURFACE_RATE: 0.5,
                SINK_OFFSET: 20,

                init: function(isRandom) {
                    var r = this.renderer;
                    this.x = this.getRandom(-r.width, r.width);
                    this.y = isRandom ? this.getRandom(0, r.height) : r.height * 1.5;
                    this.z = this.getRandom(0, this.FAR_LIMIT);
                    this.vx = this.getRandom(-1, 1);
                    this.vy = -1.6;
                    this.theta = this.getRandom(0, Math.PI * 2);
                    this.phi = this.getRandom(0, Math.PI * 2);
                    this.psi = 0;
                    this.dpsi = this.getRandom(Math.PI / 1200, Math.PI / 600);
                    this.opacity = 0;
                    this.endTheta = false;
                    this.endPhi = false;
                    this.rippleCount = 0;

                    var axis = this.getAxis(),
                        theta = this.theta + Math.ceil(-(this.y + r.height * this.SURFACE_RATE) / this.vy) * Math.PI / 1000;
                    theta %= Math.PI * 2;
                    this.offsetY = 28 * ((theta <= Math.PI / 2 || theta >= Math.PI * 3 / 2) ? -1 : 1);
                    this.thresholdY = r.height / 2 + r.height * this.SURFACE_RATE * axis.rate;

                    var grad = r.context.createRadialGradient(0, 28, 0, 0, 28, 56);
                    grad.addColorStop(0, 'hsl(310, 70%, ' + 50 * (0.3 + axis.rate) + '%)');
                    grad.addColorStop(0.05, 'hsl(310, 40%,' + 55 * (0.3 + axis.rate) + '%)');
                    grad.addColorStop(1, 'hsl(310, 20%, ' + 70 * (0.3 + axis.rate) + '%)');
                    this.entityColor = grad;

                    var shadowGrad = r.context.createRadialGradient(0, 28, 0, 0, 28, 56);
                    shadowGrad.addColorStop(0, 'hsl(310, 40%, ' + 30 * (0.3 + axis.rate) + '%)');
                    shadowGrad.addColorStop(0.05, 'hsl(310, 40%,' + 30 * (0.3 + axis.rate) + '%)');
                    shadowGrad.addColorStop(1, 'hsl(310, 20%, ' + 40 * (0.3 + axis.rate) + '%)');
                    this.shadowColor = shadowGrad;
                },

                getRandom: function(min, max) { return min + (max - min) * Math.random(); },

                getAxis: function() {
                    var rate = this.FOCUS_POSITION / (this.z + this.FOCUS_POSITION);
                    return {
                        rate: rate,
                        x: this.renderer.width / 2 + this.x * rate,
                        y: this.renderer.height / 2 - this.y * rate
                    };
                },

                renderCherry: function(ctx) {
                    ctx.beginPath();
                    ctx.moveTo(0, 28);
                    ctx.bezierCurveTo(-42, 14, -7, -42, 0, -14);
                    ctx.bezierCurveTo(7, -42, 42, 14, 0, 28);
                    ctx.fill();
                    for (var i = -4; i < 4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(0, 28);
                        ctx.quadraticCurveTo(i * 8.4, 7, i * 2.8, -16.8 + Math.abs(i) * 1.4);
                        ctx.stroke();
                    }
                },

                render: function(ctx) {
                    var axis = this.getAxis(),
                        r = this.renderer;

                    if (axis.y === this.thresholdY && this.rippleCount < this.MAX_RIPPLE_COUNT) {
                        ctx.save();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = 'hsla(0, 0%, 100%, ' + (this.MAX_RIPPLE_COUNT - this.rippleCount) / this.MAX_RIPPLE_COUNT + ')';
                        ctx.translate(axis.x + this.offsetY * axis.rate * (this.theta <= Math.PI ? -1 : 1), axis.y);
                        ctx.scale(1, 0.3);
                        ctx.beginPath();
                        ctx.arc(0, 0, this.rippleCount / this.MAX_RIPPLE_COUNT * this.RIPPLE_RADIUS * axis.rate, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.restore();
                        this.rippleCount++;
                    }

                    if (axis.y < this.thresholdY || !this.endTheta || !this.endPhi) {
                        if (this.y <= 0) this.opacity = Math.min(this.opacity + 0.005, 1);
                        ctx.save();
                        ctx.globalAlpha = this.opacity;
                        ctx.fillStyle = this.shadowColor;
                        ctx.strokeStyle = 'hsl(310, 30%,' + 40 * (0.3 + axis.rate) + '%)';
                        ctx.translate(axis.x, Math.max(axis.y, this.thresholdY + this.thresholdY - axis.y));
                        ctx.rotate(Math.PI - this.theta);
                        ctx.scale(axis.rate * -Math.sin(this.phi), axis.rate);
                        ctx.translate(0, this.offsetY);
                        this.renderCherry(ctx);
                        ctx.restore();
                    }

                    ctx.save();
                    ctx.fillStyle = this.entityColor;
                    ctx.strokeStyle = 'hsl(310, 40%,' + 70 * (0.3 + axis.rate) + '%)';
                    ctx.translate(axis.x, axis.y + Math.abs(this.SINK_OFFSET * Math.sin(this.psi) * axis.rate));
                    ctx.rotate(this.theta);
                    ctx.scale(axis.rate * Math.sin(this.phi), axis.rate);
                    ctx.translate(0, this.offsetY);
                    this.renderCherry(ctx);
                    ctx.restore();

                    if (this.y <= -r.height / 4) {
                        if (!this.endTheta) {
                            for (var theta = Math.PI / 2; theta <= Math.PI * 3 / 2; theta += Math.PI) {
                                if (this.theta < theta && this.theta + Math.PI / 400 > theta) {
                                    this.theta = theta;
                                    this.endTheta = true;
                                    break;
                                }
                            }
                        }
                        if (!this.endPhi) {
                            for (var phi = Math.PI / 8; phi <= Math.PI * 7 / 8; phi += Math.PI * 3 / 4) {
                                if (this.phi < phi && this.phi + Math.PI / 400 > phi) {
                                    this.phi = Math.PI / 8;
                                    this.endPhi = true;
                                    break;
                                }
                            }
                        }
                    }

                    if (!this.endTheta) {
                        this.theta += (axis.y === this.thresholdY) ?
                            Math.PI / 400 * ((this.theta < Math.PI / 2 || (this.theta >= Math.PI && this.theta < Math.PI * 3 / 2)) ? 1 : -1) :
                            Math.PI / 1000;
                        this.theta %= Math.PI * 2;
                    }

                    if (this.endPhi) {
                        if (this.rippleCount === this.MAX_RIPPLE_COUNT) {
                            this.psi = (this.psi + this.dpsi) % (Math.PI * 2);
                        }
                    } else {
                        this.phi += Math.PI / ((axis.y === this.thresholdY) ? 400 : 1000);
                        this.phi %= Math.PI;
                    }

                    if (this.y <= -r.height * this.SURFACE_RATE) {
                        this.x += 1;
                        this.y = -r.height * this.SURFACE_RATE;
                    } else {
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                    return this.z > -this.FOCUS_POSITION && this.z < this.FAR_LIMIT && this.x < r.width * 1.5;
                }
            };

            function initFlower() {
                var overlay = document.getElementById('flowerOverlay');
                if (!overlay || typeof $ === 'undefined') {
                    setTimeout(initFlower, 100);
                    return;
                }
                RENDERER.init(overlay);
            }

            if (document.readyState === 'complete') {
                initFlower();
            } else {
                window.addEventListener('load', initFlower);
            }

            var resizeTimer;

            function handleResize() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    var overlay = document.getElementById('flowerOverlay');
                    if (overlay && RENDERER.$container) {
                        RENDERER.$container.empty();
                        RENDERER.setParameters();
                        RENDERER.createCherries();
                    }
                }, 300);
            }
            window.addEventListener('resize', handleResize);
        })();
    </script>
</body>
</html>
