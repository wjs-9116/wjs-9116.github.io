<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>注册信息</title>
<link href="css/my.css" rel="stylesheet" type="text/css">
</head>
<body>
<form id="form1">
	
<table id="wz" cellpadding="1" cellspacing="1" border="1">
    <tr>
      <td id="zt" height="40" colspan="2" align="center">请您完善注册信息</td>
      </tr>
     <tr>
      <td width="120" height="40" align="right">姓名：</td>
      <td width="280" height="40" align="left"><input type="text" name="stu_name" id="stu_name"></td>
    </tr>    
    <tr>
      <td width="120" height="40" align="right">电话号码：</td>
      <td width="280" height="40" align="left"><input type="number" name="phone" id="phone" min="10000000000" max="99999999999" step="1" placeholder="请输入电话号码"></td>
    </tr>   
    <tr>
      <td width="120" height="40" align="right">性别：</td>
      <td width="280" height="40" align="left"><p>
        <label>
          <input type="radio" name="stu_sex" value="男" id="stu_sex_0">
          男</label>        
        <label>
          <input type="radio" name="stu_sex" value="女" id="stu_sex_1">
          女</label>       
      </p></td>
    </tr>
    <tr>
      <td width="120" height="40" align="right">出生年份：</td>
      <td width="280" height="40" align="left"><select name="stu_year" id="stu_year">
        <option value="1995">1995</option>
        <option value="1996">1996</option>
        <option value="1997">1997</option>
        <option value="1998">1998</option>
        <option value="1999">1999</option>
        <option value="2000">2000</option>
        <option value="2001">2001</option>
        <option value="2002">2002</option>
        <option value="2003">2003</option>
        <option value="2004">2004</option>
        <option value="2005">2005</option>
        <option value="2006">2006</option>
        <option value="2007">2007</option>
        <option value="2008">2008</option>
        <option value="2009">2009</option>
        <option value="2010" selected>2010</option>
        <option value="2011">2011</option>
        <option value="2012">2012</option>
        <option value="2013">2013</option>
        <option value="2014">2014</option>
        <option value="2015">2015</option>
        <option value="2016">2016</option>
        <option value="2017">2017</option>
        <option value="2018">2018</option>
        <option value="2019">2019</option>
        <option value="2020">2020</option>
        <option value="2021">2021</option>
        <option value="2022">2022</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>         
      </select></td>
    </tr>
    
    <tr>
      <td width="120" height="40" align="right">兴趣爱好：</td>
      <td width="280" height="40" align="left">
                    <!-- 修改点2：多选框（checkbox） -->
                    <label><input type="checkbox" name="hobby" value="运动"> 运动</label>
                    <label><input type="checkbox" name="hobby" value="读书"> 读书</label>
                    <label><input type="checkbox" name="hobby" value="游戏"> 游戏</label><br>
                    <label><input type="checkbox" name="hobby" value="电影"> 电影</label>
                    <label><input type="checkbox" name="hobby" value="购物"> 购物</label>
                    <label><input type="checkbox" name="hobby" value="旅游"> 旅游</label><br>
                    <label><input type="checkbox" name="hobby" value="美食"> 美食</label>
                </td>
    </tr>
    <tr>
      <td width="120" height="40" align="right">人生格言：</td>
      <td width="280" height="40" align="left"><textarea name="stu_word" cols="30" rows="5" id="stu_word"></textarea></td>
    </tr>
    <tr>
      <td width="120" height="40" align="center">&nbsp;</td>
      <td width="280" height="40" align="left"><input type="reset" name="reset" id="reset" value="重置">
        <input name="submit" type="submit" id="submit" form="form1" formaction="files/finish.html" formmethod="POST" value="提交"></td>
    </tr>  
</table>	
</form>

</body>
</html>
