<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>登录验证</title>
<link href="css/my.css" rel="stylesheet" type="text/css">

<script type="text/javascript">
function toVerify(){
	if(document.getElementById("Nickname").value.length<1||document.getElementById("mima").value.length<1) 
{  
alert("昵称和密码不能为空！");
return false; 
} 
	if(document.getElementById("Nickname").value == document.getElementById("mima").value)
{
alert("昵称和密码不能相同！");
return false; 
}	
return true; 	
	
}	
</script>
</head>
<body>	
 <form onSubmit="return toVerify()">
	<table id="wz" cellpadding="1" cellspacing="1" border="1">        
        <tr>
            <td id="zt" colspan="2" align="center">登录验证</td>
        </tr>        
        <tr>
            <td width="200" align="right">请输入您的昵称：</td>
			<td width="200" align="left"><input id="Nickname" type="text"></td>
        </tr>       
        <tr>
            <td width="200" align="right">请输入您的密码：</td>
			<td width="200" align="left"><input id="mima" type="password"></td>
        </tr>
		<tr>
            <td width="200" align="center"><input type="reset" value="重置"></td>
			<td width="200" align="center"><input type="submit" id="submit" formaction="files/ok.html" value ="提交"/></td>
        </tr>
    </table>  
</form>
</body>
</html>
