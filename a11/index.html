<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mydiv{
                width: 900px;        /* 必须设置宽度 */
                margin: 0 auto;
        }        
        #bj_cen{
            position: absolute;
            width: 900px;
            z-index: 1;
        }
        #xl{
            position: relative;
            top: 20px;
            left: 30px;
            width: 60px;
            transform: scaleX(1);
            z-index: 4; 
            animation: fly 18s linear 2s 3 normal forwards;          
        }
@keyframes fly
{
	0%   {top: 20px; left: 30px; width: 60px;transform: scaleX(1);}
	30%  {top: 450px; left: 370px; width:130px;transform: scaleX(1);}
	50%  {top: 300px; left: 800px; width: 90px;transform: scaleX(1);}
    51%  {top: 300px; left: 800px; width: 90px;transform: scaleX(-1);}
	100%  {top: 20px; left: 30px; width: 60px;transform: scaleX(-1);}	
}
#zt{
	position: absolute;
    top: 90px;
    width: 900px; 
    text-align: center;
    color: #0f0;
	font-size: 120px;
	font-family: "华文行楷";	
	opacity: 1;
	transform: translate(-0.06667em, -0.06667em);
	text-shadow: 0 0 transparent, 0.03333em 0.03333em rgba(0, 255, 0, 0.4), 0.06667em 0.06667em rgba(0, 255, 0, 0.3), 0.1em 0.1em rgba(0, 255,0, 0.2), 0.13333em 0.13333em rgba(0, 255, 0, 0.1);	
    z-index: 2;
}
#yy{
    position: absolute;
     width: 900px; 
    text-align: center;
    top: 15px;
    z-index: 3;
}
body{
    background-color: hsl(61, 62%, 85%);}
    </style>
</head>
<body>
    <div id="mydiv">
        <div id="zt">晨林鸟语</div>
        
        <img id="bj_cen" src="images/bj1.JPG">
        <img id="xl" src="images/鸟001.gif"> 
         <div id="yy">
            <audio controls autoplay loop>
                    <source src="images/鸟语.mp3" type="audio/mpeg">
            </audio>
        </div>          
    </div>
</body>
</html>
